<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Turn Claude on - zenbridge</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1f1e1d; color: #f5f4ef;
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; }
  main { max-width: 420px; padding: 24px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #c2c0b6; margin: 0 0 20px; }
  button { background: #d97757; color: #fff; border: 0; border-radius: 999px; padding: 10px 22px; font: 600 15px/1 inherit; cursor: pointer; }
  button:hover { background: #c4633f; }
  #status { margin-top: 16px; min-height: 1.5em; color: #f5f4ef; }
</style>
</head>
<body>
<main>
  <h1>Turn Claude on</h1>
  <p>Claude will be able to open and drive its own tabs, and any tab you hand it with the zenbridge button.
     It stays on until you press Alt+Shift+K.</p>
  <button id="on" type="button">Turn Claude on</button>
  <div id="status" role="status"></div>
</main>
<script src="start.js"></script>
</body>
</html>

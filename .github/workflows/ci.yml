name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Python tests
        run: python3 -m unittest discover -s tests
      - name: JS tests
        working-directory: tests/js
        run: node --test
      - name: Schema is in sync
        run: python3 gen_schema.py && git diff --exit-code extension/schema.js

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: web-ext lint
        run: npx --yes web-ext@8 lint --source-dir extension --warnings-as-errors
